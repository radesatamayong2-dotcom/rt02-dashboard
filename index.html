<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard Keuangan RT</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.container{
  max-width:1300px;
  margin:auto;
  padding:25px;
}

h1{margin-bottom:20px;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin-bottom:25px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  position:relative;
}

.stat{
  font-size:26px;
  font-weight:bold;
  margin-top:10px;
}

.positive{color:#22c55e;}
.negative{color:#ef4444;}

select{
  padding:8px 12px;
  border-radius:10px;
  border:none;
}

canvas{
  width:100% !important;
  height:320px !important;
}

.skeleton{
  background: linear-gradient(90deg,#1e293b 25%,#334155 50%,#1e293b 75%);
  background-size:200% 100%;
  animation: loading 1.5s infinite;
  border-radius:10px;
  height:25px;
}

@keyframes loading{
  0%{background-position:200% 0;}
  100%{background-position:-200% 0;}
}
</style>
</head>

<body>
<div class="container">

<h1>💳 Dashboard Keuangan RT</h1>

<div class="grid">
  <div class="card">
    Total Pemasukan
    <div id="totalMasuk" class="stat positive skeleton"></div>
  </div>
  <div class="card">
    Total Pengeluaran
    <div id="totalKeluar" class="stat negative skeleton"></div>
  </div>
  <div class="card">
    Saldo Akhir
    <div id="saldoAkhir" class="stat skeleton"></div>
  </div>
</div>

<div class="card">
Filter:
<select id="filter">
  <option value="all">Semua</option>
  <option value="week">Minggu Ini</option>
  <option value="month">Bulan Ini</option>
  <option value="year">Tahun Ini</option>
</select>
</div>

<div class="card"><canvas id="lineChart"></canvas></div>
<div class="card"><canvas id="saldoChart"></canvas></div>
<div class="card"><canvas id="barChart"></canvas></div>
<div class="card"><canvas id="donutChart"></canvas></div>

</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRSBdvTbdRKQ1aO6HYM9sHCvAKXjAWKEMWtv_y0PUv4-IE53eqYZcn2SOlLG0kDzM1pgUrEEP-Fwoan/pub?gid=0&single=true&output=csv";

window.lineChart=null;
window.barChart=null;
window.donutChart=null;
window.saldoChart=null;

let allData=[];

function loadData(){
  Papa.parse(sheetURL,{
    download:true,
    header:true,
    skipEmptyLines:true,
    complete:function(results){
      allData=[];
      results.data.forEach(r=>{
        if(!r.tanggal) return;
        const t=new Date(r.tanggal.trim());
        if(isNaN(t)) return;

        allData.push({
          tanggal:t,
          masuk:parseInt((r.pemasukan||"0").replace(/\D/g,''))||0,
          keluar:parseInt((r.pengeluaran||"0").replace(/\D/g,''))||0
        });
      });
      render();
    }
  });
}

document.getElementById("filter").addEventListener("change",render);

function render(){

  const filter=document.getElementById("filter").value;
  const now=new Date();

  let data=allData.filter(d=>{
    if(filter==="week"){
      const first=new Date();
      first.setDate(now.getDate()-now.getDay());
      first.setHours(0,0,0,0);
      return d.tanggal>=first;
    }
    if(filter==="month"){
      return d.tanggal.getMonth()===now.getMonth() &&
             d.tanggal.getFullYear()===now.getFullYear();
    }
    if(filter==="year"){
      return d.tanggal.getFullYear()===now.getFullYear();
    }
    return true;
  });

  let totalMasuk=0,totalKeluar=0,saldo=0;
  let labels=[],masukArr=[],keluarArr=[],saldoArr=[];
  let monthly={};

  data.forEach(d=>{
    totalMasuk+=d.masuk;
    totalKeluar+=d.keluar;
    saldo+=d.masuk-d.keluar;

    labels.push(d.tanggal.toLocaleDateString());
    masukArr.push(d.masuk);
    keluarArr.push(d.keluar);
    saldoArr.push(saldo);

    const key=d.tanggal.getFullYear()+"-"+(d.tanggal.getMonth()+1);
    if(!monthly[key]) monthly[key]={masuk:0,keluar:0};
    monthly[key].masuk+=d.masuk;
    monthly[key].keluar+=d.keluar;
  });

  animateNumber("totalMasuk",totalMasuk,true);
  animateNumber("totalKeluar",totalKeluar,true);
  animateNumber("saldoAkhir",saldo,false);

  destroyCharts();

  setTimeout(()=>{

    window.lineChart=new Chart(lineChart,{
      type:"line",
      data:{
        labels:labels,
        datasets:[
          {label:"Pemasukan",data:masukArr,borderColor:"#22c55e",tension:0.3},
          {label:"Pengeluaran",data:keluarArr,borderColor:"#ef4444",tension:0.3}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false}
    });

    window.saldoChart=new Chart(saldoChart,{
      type:"line",
      data:{
        labels:labels,
        datasets:[
          {label:"Saldo Kumulatif",data:saldoArr,borderColor:"#3b82f6",tension:0.3}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false}
    });

    const mLabels=Object.keys(monthly);
    const mMasuk=mLabels.map(m=>monthly[m].masuk);
    const mKeluar=mLabels.map(m=>monthly[m].keluar);

    window.barChart=new Chart(barChart,{
      type:"bar",
      data:{
        labels:mLabels,
        datasets:[
          {label:"Pemasukan",data:mMasuk,backgroundColor:"#22c55e"},
          {label:"Pengeluaran",data:mKeluar,backgroundColor:"#ef4444"}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false}
    });

    window.donutChart=new Chart(donutChart,{
      type:"doughnut",
      data:{
        labels:["Pemasukan","Pengeluaran"],
        datasets:[{
          data:[totalMasuk,totalKeluar],
          backgroundColor:["#22c55e","#ef4444"]
        }]
      },
      options:{responsive:true,maintainAspectRatio:false}
    });

  },200);
}

function destroyCharts(){
  if(window.lineChart instanceof Chart) window.lineChart.destroy();
  if(window.barChart instanceof Chart) window.barChart.destroy();
  if(window.donutChart instanceof Chart) window.donutChart.destroy();
  if(window.saldoChart instanceof Chart) window.saldoChart.destroy();
}

function animateNumber(id,value,isPositive){
  const el=document.getElementById(id);
  el.classList.remove("skeleton");

  let start=0;
  const duration=800;
  const increment=value/40;
  const timer=setInterval(()=>{
    start+=increment;
    if(start>=value){
      start=value;
      clearInterval(timer);
    }
    el.innerHTML="Rp "+Math.floor(start).toLocaleString();
  },duration/40);
}

loadData();
setInterval(loadData,60000);
</script>

</body>
</html>
