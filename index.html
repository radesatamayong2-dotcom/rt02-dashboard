<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RT 02 RW 03 Dashboard</title>

<style>
body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#0f172a;
  color:white;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}
h1{
  text-align:center;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-top:40px;
}
.card{
  background:#1e293b;
  padding:25px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
}
.title{
  font-size:14px;
  color:#94a3b8;
}
.value{
  font-size:26px;
  font-weight:bold;
  margin-top:10px;
}
.progress-bg{
  background:#1e293b;
  height:25px;
  border-radius:20px;
  overflow:hidden;
  margin-top:20px;
}
.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#2563eb,#3b82f6);
  transition:width 1.5s ease;
}
.percent{
  text-align:center;
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1>RT 02 RW 03<br>Dusun Krajan – Desa Jambewangi</h1>

<div class="grid" id="cards"></div>

<h3 style="text-align:center;margin-top:50px;">Progress Iuran Bulanan</h3>
<div class="progress-bg">
<div class="progress-bar" id="progress"></div>
</div>
<p class="percent" id="percentText"></p>

</div>

<script>

const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRSBdvTbdRKQ1aO6HYM9sHCvAKXjAWKEMWtv_y0PUv4-IE53eqYZcn2SOlLG0kDzM1pgUrEEP-Fwoan/pub?output=csv";

async function loadData(){
  try{
    const res = await fetch(sheetURL);
    const text = await res.text();

    const rows = text.trim().split("\n");

    let data = {};
    rows.forEach(row=>{
      const cols = row.split(",");
      const key = cols[0].trim();
      const value = parseFloat(cols[1]);
      data[key] = value;
    });

    const totalKK = data["total_kk"] || 0;
    const sudah = data["sudah_bayar"] || 0;
    const perKK = data["iuran_per_kk"] || 0;
    const realisasi = data["realisasi"] || 0;

    const target = totalKK * perKK;
    const belum = totalKK - sudah;
    const percent = target > 0 ? Math.round((realisasi/target)*100) : 0;

    document.getElementById("cards").innerHTML = `
      ${card("Total KK", totalKK)}
      ${card("Sudah Bayar", sudah)}
      ${card("Belum Bayar", belum)}
      ${card("Target", rupiah(target))}
      ${card("Realisasi", rupiah(realisasi))}
    `;

    document.getElementById("percentText").innerText = percent + "% Tercapai";

    setTimeout(()=>{
      document.getElementById("progress").style.width = percent+"%";
    },300);

  }catch(error){
    document.getElementById("cards").innerHTML =
      "<div style='color:red;text-align:center;'>Gagal mengambil data dari Google Sheets</div>";
    console.error(error);
  }
}

function card(title,value){
  return `<div class="card">
    <div class="title">${title}</div>
    <div class="value">${value}</div>
  </div>`;
}

function rupiah(num){
  return "Rp " + num.toLocaleString("id-ID");
}

loadData();

</script>

</body>
</html>
