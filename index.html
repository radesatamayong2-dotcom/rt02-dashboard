<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Keuangan RT - PRO MAX PLUS</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#ffffff;
  --border:#334155;
  --accent:#3b82f6;
}

body.light{
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#0f172a;
  --border:#e2e8f0;
}

body{
  margin:0;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.3s;
}

/* Membuat Topbar/Menu Kontrol Tetap Diam saat di-scroll */
.header-wrapper {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: var(--bg);
  padding: 15px 0;
  border-bottom: 2px solid var(--border);
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
}

.container{
  max-width:1300px;
  margin:auto;
  padding:0 25px;
}

.topbar{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  justify-content:space-between;
  align-items:center;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items: flex-end;
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.input-group label {
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  color: var(--accent);
}

button,select,input{
  padding:8px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  outline: none;
}

button{
  cursor:pointer;
  background:var(--accent);
  color:white;
  border:none;
  height: 38px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin: 20px 0;
}

.card{
  background:var(--card);
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.stat{
  font-size:26px;
  font-weight:bold;
  margin-top:10px;
}

.positive{color:#22c55e;}
.negative{color:#ef4444;}

.chart-container {
  position: relative;
  height: 300px;
  width: 100%;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  padding:12px;
  text-align: left;
  border-bottom:1px solid var(--border);
}

th{background:var(--border);}

/* Watermark Style (Hidden in Web, Shown in PDF) */
#pdf-watermark {
  display: none;
  text-align: right;
  font-size: 10px;
  color: #64748b;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="header-wrapper">
  <div class="container">
    <div class="topbar">
      <h2 style="margin:0">💳 Dashboard RT</h2>
      <div class="controls">
        <div class="input-group">
          <label>Filter Cepat</label>
          <select id="filter">
            <option value="all">Semua</option>
            <option value="week">Minggu Ini</option>
            <option value="month">Bulan Ini</option>
            <option value="year">Tahun Ini</option>
          </select>
        </div>

        <div class="input-group">
          <label>Filter Tanggal Mulai</label>
          <input type="date" id="fromDate">
        </div>

        <div class="input-group">
          <label>Filter Tanggal Akhir</label>
          <input type="date" id="toDate">
        </div>

        <div class="input-group">
          <label>Pencarian</label>
          <input type="text" id="search" placeholder="Cari keterangan...">
        </div>

        <button onclick="toggleTheme()">🌗 Tema</button>
        <button onclick="exportPDF()" style="background:#10b981;">📥 Export PDF</button>
      </div>
    </div>
  </div>
</div>

<div class="container" id="dashboard">
  <div class="grid">
    <div class="card">Total Pemasukan<div id="totalMasuk" class="stat positive">Rp 0</div></div>
    <div class="card">Total Pengeluaran<div id="totalKeluar" class="stat negative">Rp 0</div></div>
    <div class="card">Saldo Akhir<div id="saldoAkhir" class="stat">Rp 0</div></div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Tren Arus Kas</h3>
      <div class="chart-container"><canvas id="lineChart"></canvas></div>
    </div>
    <div class="card">
      <h3>Pertumbuhan Saldo</h3>
      <div class="chart-container"><canvas id="saldoChart"></canvas></div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Perbandingan Bulanan</h3>
      <div class="chart-container"><canvas id="barChart"></canvas></div>
    </div>
    <div class="card">
      <h3>Alokasi Dana</h3>
      <div class="chart-container"><canvas id="donutChart"></canvas></div>
    </div>
  </div>

  <div class="card">
    <h3>📋 Tabel Transaksi</h3>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Masuk</th>
            <th>Keluar</th>
            <th>Saldo</th>
            <th>Keterangan</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  
  <div id="pdf-watermark"></div>
</div>

<script>
const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRSBdvTbdRKQ1aO6HYM9sHCvAKXjAWKEMWtv_y0PUv4-IE53eqYZcn2SOlLG0kDzM1pgUrEEP-Fwoan/pub?gid=0&single=true&output=csv";

let charts={};
let allData=[];

function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("theme",document.body.classList.contains("light")?"light":"dark");
}

if(localStorage.getItem("theme")==="light"){
  document.body.classList.add("light");
}

function loadData(){
  Papa.parse(sheetURL,{
    download:true,
    header:true,
    skipEmptyLines:true,
    complete:function(results){
      allData=[];
      results.data.forEach(r=>{
        if(!r.tanggal) return;
        const t=new Date(r.tanggal.trim());
        if(isNaN(t)) return;
        allData.push({
          tanggal:t,
          masuk:parseInt((r.pemasukan||"0").replace(/\D/g,''))||0,
          keluar:parseInt((r.pengeluaran||"0").replace(/\D/g,''))||0,
          keterangan:(r.keterangan||"-").trim()
        });
      });
      render();
    }
  });
}

document.getElementById("filter").addEventListener("change",render);
document.getElementById("search").addEventListener("input",render);
document.getElementById("fromDate").addEventListener("change",render);
document.getElementById("toDate").addEventListener("change",render);

function render(){
  let data=[...allData];
  const filter=document.getElementById("filter").value;
  const search=document.getElementById("search").value.toLowerCase();
  const from=document.getElementById("fromDate").value;
  const to=document.getElementById("toDate").value;
  const now=new Date();

  data.sort((a,b)=>a.tanggal-b.tanggal);

  data=data.filter(d=>{
    if(filter==="week"){
      const first=new Date(); first.setDate(now.getDate()-now.getDay());
      first.setHours(0,0,0,0);
      if(d.tanggal<first) return false;
    }
    if(filter==="month"){
      if(d.tanggal.getMonth()!==now.getMonth() || d.tanggal.getFullYear()!==now.getFullYear()) return false;
    }
    if(filter==="year"){
      if(d.tanggal.getFullYear()!==now.getFullYear()) return false;
    }
    if(from && d.tanggal < new Date(from)) return false;
    if(to && d.tanggal > new Date(to)) return false;
    if(search && !d.keterangan.toLowerCase().includes(search)) return false;
    return true;
  });

  let totalMasuk=0, totalKeluar=0, runningSaldo=0;
  let labels=[], masukArr=[], keluarArr=[], saldoArr=[];
  let monthly={};

  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";

  data.forEach(d=>{
    totalMasuk+=d.masuk;
    totalKeluar+=d.keluar;
    runningSaldo+=d.masuk-d.keluar;

    const dStr = d.tanggal.toLocaleDateString('id-ID');
    labels.push(dStr);
    masukArr.push(d.masuk);
    keluarArr.push(d.keluar);
    saldoArr.push(runningSaldo);

    const mKey = d.tanggal.toLocaleString('id-ID', { month: 'short', year: '2-digit' });
    if(!monthly[mKey]) monthly[mKey] = {m:0, k:0};
    monthly[mKey].m += d.masuk;
    monthly[mKey].k += d.keluar;

    tbody.innerHTML+=`<tr>
      <td>${dStr}</td>
      <td class="positive">Rp ${d.masuk.toLocaleString()}</td>
      <td class="negative">Rp ${d.keluar.toLocaleString()}</td>
      <td><b>Rp ${runningSaldo.toLocaleString()}</b></td>
      <td>${d.keterangan}</td>
    </tr>`;
  });

  document.getElementById("totalMasuk").innerText="Rp "+totalMasuk.toLocaleString();
  document.getElementById("totalKeluar").innerText="Rp "+totalKeluar.toLocaleString();
  document.getElementById("saldoAkhir").innerText="Rp "+runningSaldo.toLocaleString();

  updateCharts(labels, masukArr, keluarArr, saldoArr, monthly, totalMasuk, totalKeluar);
}

function updateCharts(labels, mArr, kArr, sArr, monthly, tM, tK){
  destroyCharts();
  const opt = { responsive:true, maintainAspectRatio:false };

  charts.line = new Chart(document.getElementById("lineChart"), {
    type:'line', data:{ labels, datasets:[
      {label:'Masuk', data:mArr, borderColor:'#22c55e', backgroundColor:'#22c55e22', fill:true},
      {label:'Keluar', data:kArr, borderColor:'#ef4444', backgroundColor:'#ef444422', fill:true}
    ]}, options:opt
  });

  charts.saldo = new Chart(document.getElementById("saldoChart"), {
    type:'line', data:{ labels, datasets:[
      {label:'Saldo', data:sArr, borderColor:'#3b82f6', backgroundColor:'#3b82f622', fill:true}
    ]}, options:opt
  });

  const mLabels = Object.keys(monthly);
  charts.bar = new Chart(document.getElementById("barChart"), {
    type:'bar', data:{ labels:mLabels, datasets:[
      {label:'Masuk', data:mLabels.map(k=>monthly[k].m), backgroundColor:'#22c55e'},
      {label:'Keluar', data:mLabels.map(k=>monthly[k].k), backgroundColor:'#ef4444'}
    ]}, options:opt
  });

  charts.donut = new Chart(document.getElementById("donutChart"), {
    type:'doughnut', data:{ labels:['Masuk','Keluar'], datasets:[{
      data:[tM, tK], backgroundColor:['#22c55e','#ef4444']
    }]}, options:opt
  });
}

function destroyCharts(){
  Object.values(charts).forEach(c => { if(c instanceof Chart) c.destroy(); });
  charts={};
}

function exportPDF(){
  const element = document.getElementById("dashboard");
  const watermark = document.getElementById("pdf-watermark");
  
  // Ambil waktu WIB
  const sekarang = new Date().toLocaleString("id-ID", {
    timeZone: "Asia/Jakarta",
    dateStyle: "full",
    timeStyle: "medium"
  });
  
  watermark.style.display = "block";
  watermark.innerText = "Dicetak pada: " + sekarang + " WIB";

  const opt = {
    margin: [10, 10, 20, 10],
    filename: 'Laporan_Keuangan_RT.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, logging: false },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(element).save().then(() => {
    watermark.style.display = "none";
  });
}

loadData();
setInterval(loadData, 60000);
</script>

</body>
</html>
