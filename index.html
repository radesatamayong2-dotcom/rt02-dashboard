<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRSBdvTbdRKQ1aO6HYM9sHCvAKXjAWKEMWtv_y0PUv4-IE53eqYZcn2SOlLG0kDzM1pgUrEEP-Fwoan/pub?gid=0&single=true&output=csv";

let lineChart, barChart, donutChart;
let allData = [];

function loadData() {

  Papa.parse(sheetURL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {

      allData = [];

      results.data.forEach(row => {

        if(!row.tanggal) return;

        const tgl = new Date(row.tanggal.trim());
        if(isNaN(tgl)) return;

        const masuk = parseInt((row.pemasukan || "0").replace(/\D/g,'')) || 0;
        const keluar = parseInt((row.pengeluaran || "0").replace(/\D/g,'')) || 0;

        allData.push({
          tanggal: tgl,
          ket: row.keterangan || "",
          masuk: masuk,
          keluar: keluar
        });

      });

      console.log("Data loaded:", allData);
      renderDashboard();
    }
  });

}

function renderDashboard() {

  if(allData.length === 0){
    console.log("Data kosong");
    return;
  }

  let totalMasuk = 0;
  let totalKeluar = 0;
  let saldo = 0;

  const labels = [];
  const masukData = [];
  const keluarData = [];

  const monthly = {};

  allData.forEach(d => {

    totalMasuk += d.masuk;
    totalKeluar += d.keluar;
    saldo += d.masuk - d.keluar;

    labels.push(d.tanggal.toLocaleDateString());
    masukData.push(d.masuk);
    keluarData.push(d.keluar);

    const key = d.tanggal.getFullYear() + "-" + (d.tanggal.getMonth()+1);

    if(!monthly[key]) monthly[key] = {masuk:0, keluar:0};
    monthly[key].masuk += d.masuk;
    monthly[key].keluar += d.keluar;
  });

  document.getElementById("totalMasuk").innerHTML = "Rp " + totalMasuk.toLocaleString();
  document.getElementById("totalKeluar").innerHTML = "Rp " + totalKeluar.toLocaleString();
  document.getElementById("saldoAkhir").innerHTML = "Rp " + saldo.toLocaleString();

  if(lineChart) lineChart.destroy();
  if(barChart) barChart.destroy();
  if(donutChart) donutChart.destroy();

  setTimeout(()=>{

    lineChart = new Chart(document.getElementById("lineChart"), {
      type: "line",
      data: {
        labels: labels,
        datasets: [
          {
            label: "Pemasukan",
            data: masukData,
            borderColor: "#22c55e",
            tension: 0.3
          },
          {
            label: "Pengeluaran",
            data: keluarData,
            borderColor: "#ef4444",
            tension: 0.3
          }
        ]
      },
      options: {responsive:true, maintainAspectRatio:false}
    });

    const monthLabels = Object.keys(monthly);
    const monthMasuk = monthLabels.map(m => monthly[m].masuk);
    const monthKeluar = monthLabels.map(m => monthly[m].keluar);

    barChart = new Chart(document.getElementById("barChart"), {
      type: "bar",
      data: {
        labels: monthLabels,
        datasets: [
          {label:"Pemasukan", data:monthMasuk, backgroundColor:"#22c55e"},
          {label:"Pengeluaran", data:monthKeluar, backgroundColor:"#ef4444"}
        ]
      },
      options:{responsive:true, maintainAspectRatio:false}
    });

    donutChart = new Chart(document.getElementById("donutChart"), {
      type: "doughnut",
      data: {
        labels:["Pemasukan","Pengeluaran"],
        datasets:[{
          data:[totalMasuk,totalKeluar],
          backgroundColor:["#22c55e","#ef4444"]
        }]
      },
      options:{responsive:true, maintainAspectRatio:false}
    });

  }, 200);

}

loadData();
setInterval(loadData, 60000);

</script>
