<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard RT - FINAL PRO PLUS</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
body{
    font-family: Arial;
    background:#f4f6f9;
    margin:20px;
}
.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    margin-bottom:20px;
}
h2{
    margin-bottom:15px;
}
button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#2c7be5;
    color:white;
    cursor:pointer;
}
button:hover{
    opacity:0.9;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}
table th, table td{
    padding:8px;
    border:1px solid #ddd;
    text-align:center;
}
</style>
</head>
<body>

<div class="card">
    <h2>Upload Data CSV</h2>
    <input type="file" id="fileInput" accept=".csv">
</div>

<div class="card">
    <h2>Grafik Iuran</h2>
    <canvas id="myChart"></canvas>
</div>

<div class="card">
    <h2>Tabel Data</h2>
    <div id="tableContainer"></div>
    <button onclick="exportPDF()">Export PDF</button>
</div>

<script>
let chartInstance = null;
let globalData = [];

document.getElementById("fileInput").addEventListener("change", function(e){
    const file = e.target.files[0];
    if(!file) return;

    Papa.parse(file, {
        header:true,
        skipEmptyLines:true,
        complete: function(results){
            globalData = results.data;
            renderTable(globalData);
            renderChart(globalData);
        }
    });
});

function renderChart(data){

    const canvas = document.getElementById("myChart");
    if(!canvas) return;

    const ctx = canvas.getContext("2d");
    if(!ctx) return;

    const labels = data.map(d => d.Nama);
    const values = data.map(d => parseInt(d.Jumlah));

    if(chartInstance){
        chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
        type:"bar",
        data:{
            labels:labels,
            datasets:[{
                label:"Jumlah Iuran",
                data:values
            }]
        },
        options:{
            responsive:true,
            plugins:{
                legend:{ display:true }
            }
        }
    });
}

function renderTable(data){
    let html = "<table><tr>";

    Object.keys(data[0]).forEach(key=>{
        html += "<th>"+key+"</th>";
    });

    html += "</tr>";

    data.forEach(row=>{
        html += "<tr>";
        Object.values(row).forEach(val=>{
            html += "<td>"+val+"</td>";
        });
        html += "</tr>";
    });

    html += "</table>";

    document.getElementById("tableContainer").innerHTML = html;
}

function exportPDF(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.text("Laporan Iuran RT", 10, 10);

    let y = 20;

    globalData.forEach((row)=>{
        doc.text(Object.values(row).join(" | "), 10, y);
        y += 8;
    });

    doc.save("laporan_rt.pdf");
}
</script>

</body>
</html>
