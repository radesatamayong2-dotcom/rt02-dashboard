<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RT 02 RW 03 Smart Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#0f172a;
  color:white;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:40px 20px;
}
.card{
  background:#1e293b;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}
button{
  padding:10px 20px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}
canvas{
  background:#1e293b;
  border-radius:16px;
  padding:20px;
  margin-top:20px;
}
</style>
</head>

<body>
<div class="container">

<h1>RT 02 RW 03 - Smart Finance Dashboard</h1>

<div class="card">
<h3>Filter Periode</h3>
<button onclick="setFilter('week')">Minggu</button>
<button onclick="setFilter('month')">Bulan</button>
<button onclick="setFilter('year')">Tahun</button>
<button onclick="exportPDF()">Export PDF</button>
</div>

<canvas id="lineChart"></canvas>
<canvas id="saldoChart"></canvas>

</div>

<script>

const sheetURL = "PASTE_LINK_CSV_DISINI";
let transaksi = [];
let filterMode = "month";
let lineChart, saldoChart;

async function loadData(){
  const res = await fetch(sheetURL);
  const text = await res.text();
  const rows = text.trim().split("\n").slice(1);

  transaksi = rows.map(r=>{
    const cols = r.split(",");
    return {
      tanggal: new Date(cols[0]),
      jenis: cols[1],
      jumlah: parseFloat(cols[2])
    };
  });

  renderCharts();
}

function setFilter(mode){
  filterMode = mode;
  renderCharts();
}

function groupData(){
  let map = {};

  transaksi.forEach(t=>{
    let key;

    if(filterMode === "week"){
      const week = getWeekNumber(t.tanggal);
      key = t.tanggal.getFullYear() + "-W" + week;
    }
    else if(filterMode === "month"){
      key = t.tanggal.getFullYear() + "-" + (t.tanggal.getMonth()+1);
    }
    else{
      key = t.tanggal.getFullYear();
    }

    if(!map[key]) map[key] = {pemasukan:0,pengeluaran:0};

    map[key][t.jenis] += t.jumlah;
  });

  return map;
}

function renderCharts(){
  const grouped = groupData();
  const labels = Object.keys(grouped);
  const pemasukan = labels.map(k=>grouped[k].pemasukan);
  const pengeluaran = labels.map(k=>grouped[k].pengeluaran);

  if(lineChart) lineChart.destroy();
  if(saldoChart) saldoChart.destroy();

  lineChart = new Chart(document.getElementById("lineChart"),{
    type:'line',
    data:{
      labels:labels,
      datasets:[
        {label:'Pemasukan', data:pemasukan, borderColor:'#3b82f6'},
        {label:'Pengeluaran', data:pengeluaran, borderColor:'#ef4444'}
      ]
    },
    options:{responsive:true}
  });

  let saldo = 0;
  const saldoData = labels.map((k,i)=>{
    saldo += pemasukan[i] - pengeluaran[i];
    return saldo;
  });

  saldoChart = new Chart(document.getElementById("saldoChart"),{
    type:'line',
    data:{
      labels:labels,
      datasets:[
        {label:'Saldo Kumulatif', data:saldoData, borderColor:'#22c55e'}
      ]
    },
    options:{responsive:true}
  });
}

function getWeekNumber(d){
  d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
}

function exportPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text("Laporan Keuangan RT 02 RW 03",20,20);
  doc.save("laporan_rt02.pdf");
}

loadData();

</script>

</body>
</html>
