<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard Keuangan RT - PRO MAX PLUS</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#ffffff;
  --border:#334155;
}

body.light{
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#0f172a;
  --border:#e2e8f0;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.3s;
}

.container{
  max-width:1300px;
  margin:auto;
  padding:25px;
}

.topbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:space-between;
  align-items:center;
}

button,select,input{
  padding:8px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
}

button{
  cursor:pointer;
  background:#3b82f6;
  color:white;
  border:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin:20px 0;
}

.card{
  background:var(--card);
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.stat{
  font-size:26px;
  font-weight:bold;
  margin-top:10px;
}

.positive{color:#22c55e;}
.negative{color:#ef4444;}

canvas{
  width:100%!important;
  height:300px!important;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
}

th{background:var(--border);}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container" id="dashboard">

<div class="topbar">
  <h2>💳 Dashboard Keuangan RT</h2>
  <div class="controls">
    <select id="filter">
      <option value="all">Semua</option>
      <option value="week">Minggu Ini</option>
      <option value="month">Bulan Ini</option>
      <option value="year">Tahun Ini</option>
    </select>

    <input type="date" id="fromDate">
    <input type="date" id="toDate">

    <input type="text" id="search" placeholder="Cari keterangan...">

    <button onclick="toggleTheme()">🌗 Tema</button>
    <button onclick="exportPDF()">Export PDF</button>
  </div>
</div>

<div class="grid">
  <div class="card">Total Pemasukan<div id="totalMasuk" class="stat positive"></div></div>
  <div class="card">Total Pengeluaran<div id="totalKeluar" class="stat negative"></div></div>
  <div class="card">Saldo Akhir<div id="saldoAkhir" class="stat"></div></div>
</div>

<div class="card"><canvas id="lineChart"></canvas></div>
<div class="card"><canvas id="saldoChart"></canvas></div>
<div class="card"><canvas id="barChart"></canvas></div>
<div class="card"><canvas id="donutChart"></canvas></div>

<div class="card">
<h3>📋 Tabel Transaksi</h3>
<table>
<thead>
<tr>
<th>Tanggal</th>
<th>Pemasukan</th>
<th>Pengeluaran</th>
<th>Saldo</th>
<th>Keterangan</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>
const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRSBdvTbdRKQ1aO6HYM9sHCvAKXjAWKEMWtv_y0PUv4-IE53eqYZcn2SOlLG0kDzM1pgUrEEP-Fwoan/pub?gid=0&single=true&output=csv%22";

let charts={};
let allData=[];

function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("theme",document.body.classList.contains("light")?"light":"dark");
}

if(localStorage.getItem("theme")==="light"){
  document.body.classList.add("light");
}

function loadData(){
  Papa.parse(sheetURL,{
    download:true,
    header:true,
    skipEmptyLines:true,
    complete:function(results){
      allData=[];
      results.data.forEach(r=>{
        if(!r.tanggal) return;
        const t=new Date(r.tanggal.trim());
        if(isNaN(t)) return;

        allData.push({
          tanggal:t,
          masuk:parseInt((r.pemasukan||"0").replace(/\D/g,''))||0,
          keluar:parseInt((r.pengeluaran||"0").replace(/\D/g,''))||0,
          keterangan:(r.keterangan||"-").trim()
        });
      });
      render();
    }
  });
}

document.getElementById("filter").addEventListener("change",render);
document.getElementById("search").addEventListener("input",render);
document.getElementById("fromDate").addEventListener("change",render);
document.getElementById("toDate").addEventListener("change",render);

function render(){

  let data=[...allData];
  const filter=document.getElementById("filter").value;
  const search=document.getElementById("search").value.toLowerCase();
  const from=document.getElementById("fromDate").value;
  const to=document.getElementById("toDate").value;
  const now=new Date();

  data=data.filter(d=>{
    if(filter==="week"){
      const first=new Date();
      first.setDate(now.getDate()-now.getDay());
      first.setHours(0,0,0,0);
      if(d.tanggal<first) return false;
    }
    if(filter==="month"){
      if(d.tanggal.getMonth()!==now.getMonth() ||
         d.tanggal.getFullYear()!==now.getFullYear()) return false;
    }
    if(filter==="year"){
      if(d.tanggal.getFullYear()!==now.getFullYear()) return false;
    }
    if(from && d.tanggal<new Date(from)) return false;
    if(to && d.tanggal>new Date(to)) return false;
    if(search && !d.keterangan.toLowerCase().includes(search)) return false;
    return true;
  });

  let totalMasuk=0,totalKeluar=0,saldo=0;
  let labels=[],masukArr=[],keluarArr=[],saldoArr=[];
  let monthly={};
  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";

  data.sort((a,b)=>a.tanggal-b.tanggal);

  data.forEach(d=>{
    totalMasuk+=d.masuk;
    totalKeluar+=d.keluar;
    saldo+=d.masuk-d.keluar;

    labels.push(d.tanggal.toLocaleDateString());
    masukArr.push(d.masuk);
    keluarArr.push(d.keluar);
    saldoArr.push(saldo);

    const key=d.tanggal.getFullYear()+"-"+(d.tanggal.getMonth()+1);
    if(!monthly[key]) monthly[key]={masuk:0,keluar:0};
    monthly[key].masuk+=d.masuk;
    monthly[key].keluar+=d.keluar;

    tbody.innerHTML+=`
      <tr>
        <td>${d.tanggal.toLocaleDateString()}</td>
        <td class="positive">Rp ${d.masuk.toLocaleString()}</td>
        <td class="negative">Rp ${d.keluar.toLocaleString()}</td>
        <td>Rp ${saldo.toLocaleString()}</td>
        <td>${d.keterangan}</td>
      </tr>
    `;
  });

  document.getElementById("totalMasuk").innerText="Rp "+totalMasuk.toLocaleString();
  document.getElementById("totalKeluar").innerText="Rp "+totalKeluar.toLocaleString();
  document.getElementById("saldoAkhir").innerText="Rp "+saldo.toLocaleString();

  destroyCharts();

  const ctxLine=document.getElementById("lineChart").getContext("2d");
  charts.line=new Chart(ctxLine,{
    type:"line",
    data:{labels:labels,
      datasets:[
        {label:"Pemasukan",data:masukArr,borderColor:"#22c55e"},
        {label:"Pengeluaran",data:keluarArr,borderColor:"#ef4444"}
      ]},
    options:{responsive:true,maintainAspectRatio:false}
  });
}

function destroyCharts(){
  Object.values(charts).forEach(c=>{
    if(c instanceof Chart) c.destroy();
  });
  charts={};
}

function exportPDF(){
  html2pdf().from(document.getElementById("dashboard"))
    .save("Laporan_Keuangan_RT.pdf");
}

loadData();
setInterval(loadData,60000);
</script>

</body>
</html>
