<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard RT 02 RW 03</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.container{
  max-width:1300px;
  margin:auto;
  padding:25px;
}

h1{margin-bottom:20px;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin-bottom:25px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.stat{
  font-size:26px;
  font-weight:bold;
  margin-top:10px;
}

.positive{color:#22c55e;}
.negative{color:#ef4444;}

.card canvas{
  width:100% !important;
  height:350px !important;
}

select{
  padding:8px 12px;
  border-radius:10px;
  border:none;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #334155;
}
</style>
</head>
<body>

<div class="container">

<h1>💳 Dashboard Keuangan RT 02 RW 03</h1>

<div class="grid">
  <div class="card">
    Total Pemasukan
    <div id="totalMasuk" class="stat positive">Rp 0</div>
  </div>

  <div class="card">
    Total Pengeluaran
    <div id="totalKeluar" class="stat negative">Rp 0</div>
  </div>

  <div class="card">
    Saldo Akhir
    <div id="saldoAkhir" class="stat">Rp 0</div>
  </div>
</div>

<div class="card">
Filter:
<select id="filter">
  <option value="all">Semua</option>
  <option value="week">Minggu Ini</option>
  <option value="month">Bulan Ini</option>
  <option value="year">Tahun Ini</option>
</select>
</div>

<div class="card">
  <canvas id="lineChart"></canvas>
</div>

<div class="card">
  <canvas id="barChart"></canvas>
</div>

<div class="card">
  <canvas id="donutChart"></canvas>
</div>

<div class="card">
<h3>📋 Tabel Keuangan</h3>
<table>
<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Pemasukan</th>
<th>Pengeluaran</th>
<th>Saldo</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRSBdvTbdRKQ1aO6HYM9sHCvAKXjAWKEMWtv_y0PUv4-IE53eqYZcn2SOlLG0kDzM1pgUrEEP-Fwoan/pub?gid=0&single=true&output=csv";

let allData=[];

function fetchData(){
  fetch(sheetURL)
  .then(res=>res.text())
  .then(data=>{
    allData=[];

    const rows=data.trim().split("\n").slice(1);

    rows.forEach(r=>{
      if(!r) return;

      const c=r.split(",");
      if(c.length<4) return;

      const parts=c[0].trim().split("-");
      if(parts.length!==3) return;

      const tanggalFix=new Date(parts[0],parts[1]-1,parts[2]);

      allData.push({
        tanggal:tanggalFix,
        ket:c[1].trim(),
        masuk:parseInt(c[2].replace(/\D/g,''))||0,
        keluar:parseInt(c[3].replace(/\D/g,''))||0
      });
    });

    render();
  });
}

document.getElementById("filter").addEventListener("change",render);

function render(){

  const filter=document.getElementById("filter").value;
  const now=new Date();

  let data=allData.filter(d=>{
    if(filter==="week"){
      const firstDay=new Date();
      firstDay.setDate(now.getDate()-now.getDay());
      firstDay.setHours(0,0,0,0);
      return d.tanggal>=firstDay;
    }
    if(filter==="month"){
      return d.tanggal.getMonth()===now.getMonth() &&
             d.tanggal.getFullYear()===now.getFullYear();
    }
    if(filter==="year"){
      return d.tanggal.getFullYear()===now.getFullYear();
    }
    return true;
  });

  let totalMasuk=0,totalKeluar=0,saldo=0;
  let labels=[],masukData=[],keluarData=[];
  let monthly={};

  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";

  data.forEach(d=>{
    totalMasuk+=d.masuk;
    totalKeluar+=d.keluar;
    saldo+=d.masuk-d.keluar;

    labels.push(d.tanggal.toLocaleDateString());
    masukData.push(d.masuk);
    keluarData.push(d.keluar);

    const bulan=d.tanggal.getFullYear()+"-"+(d.tanggal.getMonth()+1);
    if(!monthly[bulan]) monthly[bulan]={masuk:0,keluar:0};
    monthly[bulan].masuk+=d.masuk;
    monthly[bulan].keluar+=d.keluar;

    tbody.innerHTML+=`
      <tr>
        <td>${d.tanggal.toLocaleDateString()}</td>
        <td>${d.ket}</td>
        <td class="positive">Rp ${d.masuk.toLocaleString()}</td>
        <td class="negative">Rp ${d.keluar.toLocaleString()}</td>
        <td>Rp ${saldo.toLocaleString()}</td>
      </tr>
    `;
  });

  animateValue("totalMasuk",totalMasuk);
  animateValue("totalKeluar",totalKeluar);
  animateValue("saldoAkhir",saldo);

  if(window.lineChart) window.lineChart.destroy();
  if(window.barChart) window.barChart.destroy();
  if(window.donutChart) window.donutChart.destroy();

  setTimeout(()=>{

    window.lineChart=new Chart(document.getElementById("lineChart"),{
      type:"line",
      data:{
        labels:labels,
        datasets:[
          {label:"Pemasukan",data:masukData,borderColor:"#22c55e",tension:0.3},
          {label:"Pengeluaran",data:keluarData,borderColor:"#ef4444",tension:0.3}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false}
    });

    const monthLabels=Object.keys(monthly);
    const monthMasuk=monthLabels.map(m=>monthly[m].masuk);
    const monthKeluar=monthLabels.map(m=>monthly[m].keluar);

    window.barChart=new Chart(document.getElementById("barChart"),{
      type:"bar",
      data:{
        labels:monthLabels,
        datasets:[
          {label:"Pemasukan",data:monthMasuk,backgroundColor:"#22c55e"},
          {label:"Pengeluaran",data:monthKeluar,backgroundColor:"#ef4444"}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false}
    });

    window.donutChart=new Chart(document.getElementById("donutChart"),{
      type:"doughnut",
      data:{
        labels:["Pemasukan","Pengeluaran"],
        datasets:[{
          data:[totalMasuk,totalKeluar],
          backgroundColor:["#22c55e","#ef4444"]
        }]
      },
      options:{responsive:true,maintainAspectRatio:false}
    });

  },100);
}

function animateValue(id,end){
  let start=0;
  const duration=800;
  const range=end-start;
  const increment=range/50;
  const obj=document.getElementById(id);
  let current=start;
  const timer=setInterval(()=>{
    current+=increment;
    if(current>=end){
      current=end;
      clearInterval(timer);
    }
    obj.innerHTML="Rp "+Math.floor(current).toLocaleString();
  },duration/50);
}

fetchData();
setInterval(fetchData,60000);

</script>

</body>
</html>
