<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RT 02 Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

h1{
  font-weight:600;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin-bottom:25px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.stat{
  font-size:24px;
  font-weight:bold;
  margin-top:10px;
}

.positive{color:#22c55e;}
.negative{color:#ef4444;}

.skeleton{
  background:linear-gradient(90deg,#1e293b 25%,#334155 50%,#1e293b 75%);
  background-size:200% 100%;
  animation:loading 1.5s infinite;
  height:20px;
  border-radius:8px;
}

@keyframes loading{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #334155;
}

button,select{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  margin-right:10px;
}

button{
  background:#38bdf8;
  cursor:pointer;
}

</style>
</head>
<body>

<div class="container">

<h1>💳 Dashboard Keuangan RT 02 RW 03</h1>

<div class="grid">
  <div class="card">
    Total Pemasukan
    <div id="totalMasuk" class="stat skeleton"></div>
  </div>

  <div class="card">
    Total Pengeluaran
    <div id="totalKeluar" class="stat skeleton"></div>
  </div>

  <div class="card">
    Saldo Akhir
    <div id="saldoAkhir" class="stat skeleton"></div>
  </div>
</div>

<div class="card">
Filter:
<select id="filter">
  <option value="all">Semua</option>
  <option value="month">Bulan Ini</option>
  <option value="year">Tahun Ini</option>
</select>
<button onclick="exportPDF()">Export PDF</button>
</div>

<div class="card">
<canvas id="chartKeuangan"></canvas>
</div>

<div class="card">
<h3>📋 Tabel Keuangan</h3>
<table>
<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Pemasukan</th>
<th>Pengeluaran</th>
<th>Saldo</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>

const sheetURL = "GANTI_LINK_CSV_KAMU";
let allData = [];

function fetchData(){
  fetch(sheetURL)
  .then(res=>res.text())
  .then(data=>{
    allData=[];
    const rows = data.split("\n").slice(1);

    rows.forEach(r=>{
      const c = r.split(",");
      if(c.length>=4){
        allData.push({
          tanggal:new Date(c[0]),
          ket:c[1],
          masuk:parseInt(c[2])||0,
          keluar:parseInt(c[3])||0
        });
      }
    });

    render();
  });
}

document.getElementById("filter").addEventListener("change",render);

function render(){

  const filter = document.getElementById("filter").value;
  const now = new Date();

  let data = allData.filter(d=>{
    if(filter==="month"){
      return d.tanggal.getMonth()===now.getMonth() &&
             d.tanggal.getFullYear()===now.getFullYear();
    }
    if(filter==="year"){
      return d.tanggal.getFullYear()===now.getFullYear();
    }
    return true;
  });

  let totalMasuk=0;
  let totalKeluar=0;
  let saldo=0;

  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";

  let labels=[];
  let masukData=[];
  let keluarData=[];

  data.forEach(d=>{
    totalMasuk+=d.masuk;
    totalKeluar+=d.keluar;
    saldo+=d.masuk-d.keluar;

    labels.push(d.tanggal.toLocaleDateString());
    masukData.push(d.masuk);
    keluarData.push(d.keluar);

    tbody.innerHTML+=`
      <tr>
        <td>${d.tanggal.toLocaleDateString()}</td>
        <td>${d.ket}</td>
        <td class="positive">Rp ${d.masuk.toLocaleString()}</td>
        <td class="negative">Rp ${d.keluar.toLocaleString()}</td>
        <td>Rp ${saldo.toLocaleString()}</td>
      </tr>
    `;
  });

  document.getElementById("totalMasuk").classList.remove("skeleton");
  document.getElementById("totalKeluar").classList.remove("skeleton");
  document.getElementById("saldoAkhir").classList.remove("skeleton");

  document.getElementById("totalMasuk").innerHTML="Rp "+totalMasuk.toLocaleString();
  document.getElementById("totalKeluar").innerHTML="Rp "+totalKeluar.toLocaleString();
  document.getElementById("saldoAkhir").innerHTML="Rp "+saldo.toLocaleString();

  if(window.chart) window.chart.destroy();

  window.chart=new Chart(
    document.getElementById("chartKeuangan"),
    {
      type:"line",
      data:{
        labels:labels,
        datasets:[
          {
            label:"Pemasukan",
            data:masukData,
            borderColor:"#22c55e",
            tension:0.3
          },
          {
            label:"Pengeluaran",
            data:keluarData,
            borderColor:"#ef4444",
            tension:0.3
          }
        ]
      }
    }
  );
}

function exportPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text("Laporan Keuangan RT 02 RW 03",10,10);
  doc.text("Generated: "+new Date().toLocaleString(),10,20);
  doc.save("laporan-rt02.pdf");
}

fetchData();
setInterval(fetchData,60000);

</script>

</body>
</html>
